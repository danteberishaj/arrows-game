plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.danteb.arrows'
version = '1.0.0'

android {
  namespace 'com.danteb.arrows.update'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Play In-App Updates (also ships FakeAppUpdateManager, used only when JS passes fake = true in QA builds).
  implementation "com.google.android.play:app-update:2.1.0"
}
