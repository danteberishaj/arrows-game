<!--
  Arrows brand emblem (the wordmark's "A"), W5-13. Source of truth for every
  emblem raster: scripts/art/render-mark.ts renders mark.png, the launcher
  icon set and the favicon from this file, and writes src/ui/brandMark.ts.

  Built from geometry, not traced: nine flat faces (two interlocking
  arrowheads), on 26 shared vertices whose positions were measured against
  the old 512 px mark.png (coordinates are that raster's pixel grid).
  Colours are the medians of each face in that raster:
    #6C49E5 light violet, #5130C2 dark violet, #E63C7F magenta, #BA2469 dark magenta.
  Paint order is back to front. Where two faces share an edge, the face
  behind carries an extra subpath (an "underlap": 5 units wide along the
  part of the edge the two share, inside the front face and 0.75 units clear
  of its other edges), so antialiased edges never let the background
  through as a seam. Keep every subpath of a path in the same winding.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- LV: left bar, top face (light violet). Extra subpaths: underlap under DV1, DPL and DVB -->
  <path id="LV" fill="#6C49E5" d="M242.35 233.22 147.3 395.98 120.22 349.48 120.33 344.18 256.05 117.05Z M255.42 165.12 248.82 221.08 242.56 231.42 255.32 123.28Z M196.08 314.17 199.65 316.25 175.27 358 151.4 388.95 194.59 315.01Z M220.46 270.7 226.21 260.85 230.5 263.43 224.35 273.97 221.36 272.22Z"/>
  <!-- DPL: lower pink bar, side face along the left bar (dark magenta). Extra subpath: underlap under PL -->
  <path id="DPL" fill="#BA2469" d="M148.44 394.01 195.33 313.73 221.82 298.85Z M161.04 385.87 149.65 392.45 220.57 300.48 222.46 299.34 225.78 301.9Z"/>
  <!-- PL: lower pink bar, top face (magenta). Extra subpath: underlap under DVB -->
  <path id="PL" fill="#E63C7F" d="M148.44 394.01 221.82 298.85 233.55 291.8 255.75 332Z M236.74 289.93 260.06 329.46 256.49 331.56 254.97 330.68 232.43 292.47Z"/>
  <!-- P1: upper pink bar, top face (magenta). Extra subpaths: underlap under DV1, DP1 and DVR -->
  <path id="P1" fill="#E63C7F" d="M243.85 258.6 263.9 224.85 256.27 210.2 256.05 117.05 320.8 225.22 285.23 282.93Z M256.07 123.33 256.27 208.76 255.4 210.2 251.28 210.21 251.17 164.87Z M282.07 286.87 241.9 263.26 244.5 258.98 284.58 282.54Z M292.52 271.09 319.49 227.36 315.39 243.53 296.33 274.44 293.46 272.67Z"/>
  <!-- DP1: upper pink bar, underside seen through the middle (dark magenta); its lower end runs under DVB -->
  <path id="DP1" fill="#BA2469" d="M243.85 258.6 285.23 282.93 279.32 293.07 237.45 269.15Z M235.96 271.66 238.53 267.37 263.98 282.65 279.85 292.17 277.28 296.46Z"/>
  <!-- DV1: left bar, inner side face under the apex (dark violet) -->
  <path id="DV1" fill="#5130C2" d="M256.27 210.2 242.35 233.22 256.05 117.05Z"/>
  <!-- LVR: right bar, top face (light violet). Extra subpaths: underlap under DVR and DVB -->
  <path id="LVR" fill="#6C49E5" d="M320.8 225.22 390.6 342 393.32 346.6 364.95 395.23 307.07 296.93 303.95 291.73Z M300.59 284.63 311.43 241.85 320.19 227.65 304.21 290.7Z M355.37 388.81 313.32 317.39 316.9 315.29 318.43 316.21 364.18 393.91Z"/>
  <!-- DVR: right bar, inner side face (dark violet) -->
  <path id="DVR" fill="#5130C2" d="M320.8 225.22 303.95 291.73 292.08 271.81Z"/>
  <!-- DVB: the crossing band from the middle to the bottom-right tip (dark violet), frontmost -->
  <path id="DVB" fill="#5130C2" d="M226.59 260.2 317.63 314.86 364.95 395.23 255.75 332 220.03 271.44Z"/>
</svg>
